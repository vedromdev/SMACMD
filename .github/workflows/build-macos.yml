name: Build macOS app

# Builds the native macOS .app bundle with py2app and uploads it as an artifact.
# Trigger it manually from the Actions tab, or push a tag like v2.0.0.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install py2app pillow

      - name: Build the .app bundle
        run: python setup.py py2app

      - name: Zip the bundle
        run: |
          cd dist
          zip -r -y "SCMD-Workshop-Downloader-2-macOS.zip" "SCMD Workshop Downloader 2.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCMD-Workshop-Downloader-2-macOS
          path: dist/SCMD-Workshop-Downloader-2-macOS.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SCMD-Workshop-Downloader-2-macOS.zip
